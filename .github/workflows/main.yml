name: generate animation

on:
  schedule:
    # every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@master
        id: snake-gif
        with:
          github_user_name: tohoangkhoi
          svg_out_path: dist/github-contribution-grid-snake.svg

      # Darken the "empty" tiles in the SVG
      - name: Make empty dots dark
        run: |
          # Try common empty-cell colors used by the action and replace with a dark gray.
          # If your SVG uses a different empty color, adjust the left side.
          sed -i 's/fill="#ebedf0"/fill="#161b22"/g' dist/github-contribution-grid-snake.svg
          sed -i 's/fill="#eeeeee"/fill="#161b22"/g' dist/github-contribution-grid-snake.svg
          sed -i 's/fill="rgb(235,237,240)"/fill="#161b22"/g' dist/github-contribution-grid-snake.svg

      - uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN_GH_PAGES }}
